name: Dynamic Array CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dynamic-array-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and run dynamic array tests
        run: make -C solutions/1_basics/02_dynamic_array test
